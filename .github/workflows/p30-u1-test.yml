name: P30 U1 Test (wird wieder entfernt)
on:
  push:
    branches: [claude/datenharmonisierung]
    paths: [.github/workflows/p30-u1-test.yml]
permissions:
  contents: read
jobs:
  u1:
    runs-on: ubuntu-latest
    steps:
      - name: Erreichbarkeit Anbieterseiten
        run: |
          for u in https://www.maz.ch/ https://www.orsys.fr/ https://digicomp.ch/ https://www.mediencampus.ch/; do
            curl -s -o /dev/null -A "mediaskills-pruefung (+https://mediaskills.ch/methodik.html)" -w "%{http_code} %{url_effective}\n" --max-time 20 "$u" || echo "FEHLER $u"
          done
