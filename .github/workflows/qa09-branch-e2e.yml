name: QA09 116 PR browser E2E (isolated verification branch)
on:
  push:
    branches: [qa09-pr1-e2e-check-20261016]
permissions:
  contents: read
jobs:
  qa09_browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test library
        run: npm install --no-save playwright-core
      - name: Chromium E2E on local PR staging
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server --bind 127.0.0.1 8765 > /tmp/qa09-server.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi; sleep 1; done
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          export CHROME_PATH
          cat > /tmp/qa09-browser.mjs <<'JS'
          import {chromium} from "./node_modules/playwright-core/index.mjs";
          const assert = (cond,msg) => {if(!cond) throw new Error(msg)};
          const browser=await chromium.launch({headless:true, executablePath:process.env.CHROME_PATH,args:["--no-sandbox"]});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          const base='http://127.0.0.1:8765/';
          await page.goto(base,{waitUntil:'networkidle'});
          await page.waitForFunction(()=>document.querySelector('#resultCount')?.textContent?.includes('aktuellen Angeboten'),{timeout:30000});
          const baseline=await page.evaluate(()=>{
            const d=window.WEITERBILDUNGSRADAR_OFFERS,s=window.MEDIA_SKILLS_SMART_DATA?.byId;
            const t=new Date();t.setHours(0,0,0,0);
            const cur=d.filter(o=>!/^\d{4}-\d{2}-\d{2}$/.test(o.endDate||'') || new Date(o.endDate+'T23:59:59')>=t);
            return {total:d.length,smart:Object.keys(s||{}).length,active:cur.length,
              uniqueIds:new Set(d.map(o=>o.id)).size,
              maz:d.find(o=>o.id==='OFFER-MAZ-182'),
              cad:d.find(o=>o.id==='CAD-002'),
              cadSmart:s?.['CAD-002'], oldIndexLoaded:typeof window.SFJ_SEARCH_INDEX!=='undefined',
              fullUiCount:document.querySelectorAll('#cards [data-offer-id]').length
            };
          });
          assert(baseline.total===1352 && baseline.smart===1352 && baseline.uniqueIds===1352,'roster, sidecar or ID mismatch '+JSON.stringify(baseline).slice(0,300));
          assert(baseline.fullUiCount===baseline.active,'initial currentness/browser cards mismatch '+JSON.stringify({actual:baseline.fullUiCount,expected:baseline.active}));
          assert(baseline.maz?.endDate==='' && baseline.maz?.duration==='Nicht aktuell bestätigt','MAZ-182 unconfirmed end date/display regression');
          assert(baseline.cadSmart?.delivery?.structure==='MODE_CHOICE','CAD-002 mode choice absent');
          assert(baseline.cadSmart.delivery.variants.some(v=>v.deliveryVariantId==='B'&&v.attendanceChannels.includes('REMOTE')),'CAD-002 async online variant absent');
          assert(!baseline.oldIndexLoaded,'legacy index unexpectedly loaded');
          assert(errors.length===0,'JS errors at startup '+errors.join('|'));
          // Classic filters
          await page.locator('#searchInput').fill('Photoshop - Base');
          await page.waitForFunction(()=>document.querySelector('#resultCount')?.textContent && !document.querySelector('#resultCount').textContent.startsWith('0 von'));
          assert(await page.locator('[data-offer-id="CAD-002"]').count()===1,'CAD-002 missing from classical text results');
          await page.locator('#formatFilter').selectOption('ONLINE SELBSTLERNEN');
          assert(await page.locator('[data-offer-id="CAD-002"]').count()===1,'CAD-002 online self-learning classic filter mismatch');
          await page.locator('#resetFilters').click();
          // Smart query must return eligible online route B at CHF250, and never substitute CHF150 optional certification fee
          await page.locator('#smartInput').fill('Photoshop Base online selbstlernen CHF 300');
          await page.locator('#smartSearchForm').evaluate(el=>el.requestSubmit());
          await page.waitForTimeout(250);
          const smartText=await page.locator('#smartResults').innerText();
          assert(smartText.includes('Photoshop - Base'),'CAD-002 excluded from online+self-study Smart query: '+smartText.slice(0,400));
          assert(smartText.includes('CHF 250'),'CAD-002 variant price not CHF250: '+smartText.slice(0,400));
          assert(!smartText.includes('CHF 150'),'CAD optional certification erroneously shown as base tariff');
          await page.locator('#smartInput').fill('Photoshop Base rein online CHF 300');
          await page.locator('#smartSearchForm').evaluate(el=>el.requestSubmit());
          await page.waitForTimeout(250);
          const strictText=await page.locator('#smartResults').innerText();
          assert(strictText.includes('Photoshop - Base'),'CAD-002 missing in strict online Smart query');
          // Generic budget, conditional/free and price-unknown guards
          await page.locator('#smartInput').fill('Ich habe CHF 800 und möchte Datenjournalismus lernen');
          await page.locator('#smartSearchForm').evaluate(el=>el.requestSubmit());
          assert((await page.locator('#smartSummary').innerText()).length>10,'budget query did not generate summary');
          await page.locator('#smartInput').fill('Datenjournalismus kostenlos');
          await page.locator('#smartSearchForm').evaluate(el=>el.requestSubmit());
          const freeSummary=await page.locator('#smartSummary').innerText();
          assert(freeSummary.length>10,'free intent query did not generate a summary');
          assert(errors.length===0,'JavaScript page errors '+errors.join(' | '));
          await page.setViewportSize({width:390,height:844});
          const layout=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,viewport:document.documentElement.clientWidth}));
          assert(layout.scroll<=layout.viewport,'Mobile horizontal overflow '+JSON.stringify(layout));

          // Independent browser matrix: every one of the exact QA09 116 IDs
          const qaIds=["V52-MEEL-INSTAGRAM","OFFER-CORSO-001","OFFER-FERNUNI-002","OFFER-HKB-001","OFFER-IFC-005","OFFER-IFC-006","OFFER-IFC-007","OFFER-IFC-008","OFFER-IFC-012","OFFER-IFC-014","OFFER-IFC-020","V79-02","OFFER-NOBLE-004","OFFER-NOBLE-006","OFFER-NOBLE-008","OFFER-NOBLE-013","OFFER-NOBLE-014","OFFER-NOBLE-016","OFFER-NOBLE-020","OFFER-NOBLE-021","OFFER-NOBLE-033","OFFER-NOBLE-035","OFFER-NOBLE-037","OFFER-NOBLE-044","OFFER-NOBLE-057","OFFER-NOBLE-064","OFFER-NOBLE-067","OFFER-ORSYS-006","OFFER-ORSYS-007","OFFER-ORSYS-008","OFFER-ORSYS-009","OFFER-ORSYS-012","OFFER-ORSYS-014","OFFER-ORSYS-020","OFFER-ORSYS-039","OFFER-ORSYS-041","OFFER-ORSYS-042","OFFER-ORSYS-051","OFFER-ORSYS-054","OFFER-ORSYS-057","OFFER-ORSYS-063","OFFER-ORSYS-069","OFFER-ORSYS-070","OFFER-ORSYS-075","OFFER-ORSYS-076","OFFER-ORSYS-078","OFFER-ORSYS-082","OFFER-ORSYS-083","OFFER-ORSYS-088","OFFER-ORSYS-094","OFFER-ORSYS-099","OFFER-ORSYS-103","OFFER-ORSYS-115","OFFER-ORSYS-118","OFFER-ORSYS-120","OFFER-ORSYS-122","OFFER-ORSYS-137","OFFER-ORSYS-138","OFFER-ORSYS-139","OFFER-ORSYS-141","OFFER-ORSYS-143","OFFER-ORSYS-144","OFFER-ORSYS-146","OFFER-ORSYS-151","AT-PROD-OFFER-168","AT-PROD-OFFER-154","OFFER-UZHDSI-001","CAD-002","CAD-018","CAD-025","OFFER-CFJM-007","OFFER-CFJM-008","OFFER-CFJM-013","OFFER-CFJM-014","OFFER-CFJM-015","OFFER-CFJM-016","V82-DAWAN-012","V82-DAWAN-017","V82-DAWAN-029","V82-DAWAN-037","V82-DAWAN-039","V82-DAWAN-094","OFFER-EBU-013","OFFER-EBU-014","OFFER-EBU-015","OFFER-EBU-019","AT-PROD-OFFER-003","AT-PROD-OFFER-209","AT-PROD-OFFER-211","IF-G04","IF-P03","IF-P08","IF-P10","IF-W03","V78-04","OFFER-MAZ-005","OFFER-MAZ-045","OFFER-MAZ-058","OFFER-MAZ-075","OFFER-MAZ-107","OFFER-MAZ-168","OFFER-MAZ-176","OFFER-MAZ-181","OFFER-MAZ-182","PCC-P02","PCC-P03","PCC-P05","PCC-P08","PCC-P16","PCC-P23","PCC-P28","PCC-P32","PCC-P33","PJ-V16-07","V58-S1-07","AT-PROD-OFFER-172"];
          const qaMatrix=await page.evaluate((targetIds)=>{
            const rec=Object.fromEntries(window.WEITERBILDUNGSRADAR_OFFERS.map(o=>[o.id,o]));
            const smart=window.MEDIA_SKILLS_SMART_DATA.byId;
            const date=new Date(); date.setHours(0,0,0,0);
            const issues=[];
            const dup=new Set();
            for(const id of targetIds){
              if(dup.has(id)){issues.push(id+':duplicate-target');continue;}
              dup.add(id);
              const o=rec[id],s=smart[id];
              if(!o||!s){issues.push(id+':missing-record-or-sidecar');continue;}
              const isOld=!!(o.endDate && /^\d{4}-\d{2}-\d{2}$/.test(o.endDate) && new Date(o.endDate+'T23:59:59')<date);
              const matches=Array.from(document.querySelectorAll('#cards [data-offer-id]')).filter(el=>el.dataset.offerId===id);
              if(matches.length!==(isOld?0:1))issues.push(id+':visible-card-count='+matches.length+' old='+isOld);
              if(matches.length){
                const card=matches[0],link=card.querySelector('a.source-link[href]');
                if(!card.textContent.includes(o.title))issues.push(id+':title-missing-from-card');
                if(!link||link.href!==o.url)issues.push(id+':direct-link-mismatch');
                if(o.duration&&!card.textContent.includes(o.duration))issues.push(id+':duration-not-rendered');
              }
              if(!o.url.startsWith('https://'))issues.push(id+':invalid-source-url');
              if(s.priceEligible===true&&s.parserStatus!=='AUTO_ACCEPT')issues.push(id+':unsafe-price-parser');
              const variantIds=new Set((s.delivery?.variants||[]).map(v=>v.deliveryVariantId));
              for(const opt of s.priceOptions||[])for(const ref of opt.deliveryVariantRefs||[])if(!variantIds.has(ref))issues.push(id+':orphan-variant-ref');
              if(o.format==='NICHT_PUBLIZIERT' && (s.delivery?.channels||[]).length>0)issues.push(id+':unknown-format-with-confirmed-channels');
              if(o.startDate&&o.endDate&&o.endDate<o.startDate)issues.push(id+':end-before-start');
              if(id==='OFFER-ORSYS-041'&&s.priceEligible!==false)issues.push(id+':contradictory-price-budget-enabled');
              if(id==='OFFER-IFC-008'&&o.startDate!=='')issues.push(id+':official-conflict-date-asserted');
              if(id==='OFFER-MAZ-107'&&o.endDate!=='')issues.push(id+':unverified-duration-endDate');
              if(id==='OFFER-MAZ-182'&&o.endDate!=='')issues.push(id+':old-unverified-three-day-endDate');
              if(id==='OFFER-NOBLE-067'&&o.startDate!=='')issues.push(id+':unpublished-new-term-inserted');
              if(id==='V78-04'&&!String(o.duration).includes('widersprüchlich'))issues.push(id+':primary-duration-discrepancy-hidden');
              if(id==='OFFER-CFJM-013'&&(!o.start.includes('2027')||!o.start.includes('2026')))issues.push(id+':two-course-editions-collapsed');
              if(id==='CAD-002'){
                if(!s.delivery.variants.some(v=>v.deliveryVariantId==='B'&&v.attendanceChannels.includes('REMOTE')))issues.push(id+':asynchronous-remote-absent');
                if(!s.priceOptions.some(v=>v.amount===250&&v.deliveryVariantRefs?.includes('B')))issues.push(id+':250-price-not-bound-to-B');
              }
            }
            return {count:dup.size,issues};
          },qaIds);
          assert(qaMatrix.count===116,'116-browser-matrix denominator wrong');
          assert(qaMatrix.issues.length===0,'116-browser-matrix failed '+JSON.stringify(qaMatrix.issues.slice(0,40)));
          console.log('QA09_116_IN_BROWSER_PASS',qaMatrix.count);

          // Browser flows: URL state, sort, favorites, all classic filter dimensions
          await page.setViewportSize({width:1280,height:900});
          await page.locator('#searchInput').fill('MAZ');
          await page.waitForFunction(()=>new URL(location.href).searchParams.get('q')==='MAZ');
          await page.locator('#sortSelect').selectOption('START');
          await page.waitForFunction(()=>new URL(location.href).searchParams.get('sort')==='START');
          const sorted=await page.evaluate(()=>{
            const ids=[...document.querySelectorAll('#cards [data-offer-id]')].slice(0,12).map(el=>el.dataset.offerId);
            const byId=Object.fromEntries(window.WEITERBILDUNGSRADAR_OFFERS.map(x=>[x.id,x]));
            const today=new Date();today.setHours(0,0,0,0);
            return ids.map(id=>({id,date:byId[id]?.startDate||'',future:!!(byId[id]?.startDate && new Date(byId[id].startDate+'T23:59:59')>=today)}));
          });
          for(let i=1;i<sorted.length;i++)if(sorted[i-1].future&&sorted[i].future)assert(sorted[i-1].date<=sorted[i].date,'START sort chronology broken');
          const shared=page.url();
          await page.reload({waitUntil:'networkidle'});
          assert((await page.locator('#searchInput').inputValue())==='MAZ','shared URL q not restored');
          assert((await page.locator('#sortSelect').inputValue())==='START','shared sort not restored');
          assert(page.url()===shared,'shared URL changed on reload');
          const favId=await page.locator('#cards [data-offer-id]').first().getAttribute('data-offer-id');
          await page.locator('[data-favorite-id="'+favId+'"]').first().click();
          assert((await page.evaluate(id=>JSON.parse(localStorage.getItem('weiterbildungsradar:favorites:v1')||'[]').includes(id),favId)),'favorites localStorage persistence broken');
          await page.locator('#searchInput').fill('');
          await page.locator('#favoritesToggle').click();
          assert(await page.locator('#cards [data-offer-id="'+favId+'"]').count()===1,'Favorites-only filter dropped saved item');
          await page.locator('#resetFilters').click();
          const listNow=await page.locator('#cards [data-offer-id]').count();
          assert(listNow===baseline.active,'reset did not restore full current roster');
          for(const selector of ['#focusFilter','#typeFilter','#priceFilter','#formatFilter','#languageFilter','#countryFilter','#levelFilter']){
            const val=await page.locator(selector+' option:not([value=""])').first().getAttribute('value');
            if(!val)continue;
            await page.locator(selector).selectOption(val);
            assert((await page.locator(selector).inputValue())===val,'classic filter not selectable '+selector);
            assert((await page.locator('#filterStatus').innerText()).includes('Filter aktiv'),'filter status did not update '+selector);
            await page.locator('#resetFilters').click();
          }
          await page.locator('#searchInput').fill('xxyyyzz-no-such-course-qa09');
          await page.waitForFunction(()=>document.querySelector('#resultCount')?.textContent?.startsWith('0 von'));
          assert(await page.locator('#emptyState').isVisible(),'empty results state missing');
          await page.locator('#resetFilters').click();
          await page.locator('#smartInput').fill('Photoshop Base online CHF 400');
          await page.locator('#smartInput').press('Enter');
          assert((await page.locator('#smartSummary').innerText()).length>10,'Smart keyboard submit broken');
          assert(!decodeURIComponent(page.url()).includes('Photoshop Base online CHF 400'),'private Smart query was exposed in shared URL');
          assert(errors.length===0,'Browser UX flows produced JS errors: '+errors.join('|'));
          console.log('QA09_URL_FILTER_FAVORITES_SORT_PASS');
          await browser.close();
          console.log('QA09_BROWSER_E2E_PASS',JSON.stringify({active:baseline.active,total:baseline.total,smart:baseline.smart,checked:['CAD-002 classical+smart online/self-paced+CHF250','MAZ-182 unconfirmed end','date/currentness','budget','conditional free','mobile']}));
          JS
          mv /tmp/qa09-browser.mjs ./qa09-browser.mjs
          node ./qa09-browser.mjs
