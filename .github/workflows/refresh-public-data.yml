name: Refresh public test dataset
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-public-data.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch already-public production dataset
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://mediaskills.ch/data.js -o /tmp/data.js
          echo "92d4de7de0954cebd5b9a2d6d37b4a8f495c5f91d117ff192a748f5e0f63f7c7  /tmp/data.js" | sha256sum --check -
          mv /tmp/data.js data.js
          rm -rf _staging/data-parts
          rm -f .github/workflows/refresh-public-data.yml
      - name: Commit verified dataset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use verified public Media Skills dataset [skip ci]"
          git push origin HEAD:main
