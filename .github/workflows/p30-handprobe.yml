name: P30 U3 Handprobe (wird wieder entfernt)
on:
  push:
    branches: [claude/datenharmonisierung]
    paths: [.github/workflows/p30-handprobe.yml]
permissions:
  contents: read
jobs:
  handprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: claude-work/pruefung
      - name: Titel, Überschrift und Datumsangaben (je Seite höchstens 15 Auszüge zu 70 Zeichen)
        shell: bash {0}
        run: |
          UA="mediaskills-pruefung/0.1 (+https://mediaskills.ch/methodik.html)"
          cat > probe.py <<'PY'
          import sys, html, re
          roh = sys.stdin.buffer.read().decode("utf-8", "replace")
          def m(p): x = re.search(p, roh, re.I | re.S); return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", x.group(1)))).strip()[:120] if x else "-"
          print("title:", m(r"<title[^>]*>(.*?)</title>")); print("h1:", m(r"<h1[^>]*>(.*?)</h1>"))
          ld = re.findall(r'"(?:startDate|endDate|price)"\s*:\s*"?([^",}]{1,40})', roh)
          print("jsonld:", sorted(set(ld))[:15])
          t = re.sub(r"(?is)<(script|style|noscript)\b.*?</\1\s*>", " ", roh); t = re.sub(r"(?s)<[^>]+>", " ", t); t = re.sub(r"\s+", " ", html.unescape(t))
          MON = r"(?:janv|févr|fevr|mars|avr|mai|juin|juil|août|aout|sept|oct|nov|déc|dec|jan|feb|mär|mar|apr|may|jun|jul|aug|sep|okt|dez|gen|giu|lug|ago|set|ott|dic)[a-zéûä]*\.?"
          pat = r"\b\d{1,2}\.\s?\d{1,2}\.(?:\s?\d{2,4})?|\b\d{4}-\d{2}-\d{2}\b|\b\d{1,2}\.?\s(?:au\s|-\s|–\s)?(?:\d{1,2}\s)?" + MON + r"\s?\d{0,4}|\b" + MON + r"\s\d{1,2},?\s\d{4}"
          n = 0
          for x in re.finditer(pat, t, re.I):
              a = max(0, x.start() - 30); print("  datum:", t[a:x.end() + 30].strip()); n += 1
              if n >= 15: break
          PY
          for id in OFFER-MAZ-001 OFFER-MAZ-002 OFFER-ORSYS-006 OFFER-ORSYS-002 OFFER-DIGICOMP-034 OFFER-DIGICOMP-075 OFFER-DIGICOMP-041 OFFER-MEDIENCAMPUS-001 OFFER-NOBLE-016 AT-PROD-OFFER-028 AT-PROD-OFFER-026 OFFER-CFJM-007 OFFER-SGP-001 OFFER-HEAD-003 OFFER-SAEZH-011; do
            url=$(awk -v i="$id" '$1==i{print $2}' claude-work/pruefung/handprobe_urls.txt)
            echo "## $id"
            curl -sS -L -A "$UA" --max-time 30 "$url" | python3 probe.py
            sleep 3
          done
          echo "## dawan erneut, 60 s"; curl -sS -o /dev/null -A "$UA" --max-time 60 -w "%{http_code} %{time_total}\n" https://www.dawan.ch/ || true
          echo "## Ende"
