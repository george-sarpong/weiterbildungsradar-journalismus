name: P30 U3 Handprobe (wird wieder entfernt)
on:
  push:
    branches: [claude/datenharmonisierung]
    paths: [claude-work/pruefung/handprobe_urls.txt]
permissions:
  contents: read
jobs:
  handprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: claude-work/pruefung
      - name: Seiten laden (curl, je Anfrage 3 s Abstand)
        run: |
          mkdir -p hp
          UA="mediaskills-pruefung/0.1 (+https://mediaskills.ch/methodik.html)"
          while read -r id url; do
            [ -z "$id" ] && continue
            echo "== $id $url"
            curl -sS -o /dev/null -A "$UA" --max-time 30 -w "erste_antwort %{http_code} %{redirect_url}\n" "$url" > "hp/$id.status" 2>&1 || true
            sleep 3
            curl -sS -L -A "$UA" --max-time 30 -D "hp/$id.headers" -o "hp/$id.body" -w "ende %{http_code} redirects=%{num_redirects} %{url_effective} %{content_type}\n" "$url" >> "hp/$id.status" 2>&1 || true
            cat "hp/$id.status"
            sleep 3
          done < claude-work/pruefung/handprobe_urls.txt
          for h in $(awk '{print $2}' claude-work/pruefung/handprobe_urls.txt | awk -F/ '{print $1"//"$3}' | sort -u); do
            n=$(echo "$h" | sed 's#https\?://##')
            curl -sS -A "$UA" --max-time 20 -o "hp/robots_$n.txt" -w "robots $n %{http_code}\n" "$h/robots.txt" || true
            sleep 2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: handprobe
          path: hp/
          retention-days: 1
