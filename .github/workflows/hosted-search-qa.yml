name: Hosted Search V1.2 QA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hosted-search-qa.yml
permissions:
  contents: read

jobs:
  hosted-qa:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://george-sarpong.github.io/weiterbildungsradar-journalismus
    steps:
      - uses: actions/checkout@v4
      - name: HTTP MIME hash path and cache checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hosted-qa
          fetch() {
            local f="$1"
            curl --fail --silent --show-error --location --retry 3 -H 'Cache-Control: no-cache' -D "/tmp/hosted-qa/$f.headers" -w '%{url_effective}\n' "$BASE_URL/$f?qa=$GITHUB_SHA" -o "/tmp/hosted-qa/$f" > "/tmp/hosted-qa/$f.effective"
          }
          for f in index.html styles.css data.js search-index-v1.2.js search-engine-v1.2.js app.js methodik.html datenschutz.html; do fetch "$f"; done
          curl --fail --silent --show-error --location --retry 3 -H 'Cache-Control: no-cache' -D /tmp/hosted-qa/root.headers -w '%{url_effective}\n' "$BASE_URL/?qa=$GITHUB_SHA" -o /tmp/hosted-qa/root.html > /tmp/hosted-qa/root.effective
          echo "Hosted effective URL: $(cat /tmp/hosted-qa/index.html.effective)"
          case "$(cat /tmp/hosted-qa/index.html.effective)" in
            "$BASE_URL"/index.html*) ;;
            *) echo "Unexpected redirect/effective URL"; exit 1 ;;
          esac
          echo "Repo hashes:"
          sha256sum index.html styles.css data.js search-index-v1.2.js search-engine-v1.2.js app.js methodik.html datenschutz.html
          echo "Hosted hashes:"
          sha256sum /tmp/hosted-qa/index.html /tmp/hosted-qa/styles.css /tmp/hosted-qa/data.js /tmp/hosted-qa/search-index-v1.2.js /tmp/hosted-qa/search-engine-v1.2.js /tmp/hosted-qa/app.js /tmp/hosted-qa/methodik.html /tmp/hosted-qa/datenschutz.html

          grep -qi '^content-type:.*text/html' /tmp/hosted-qa/index.html.headers
          grep -qi '^content-type:.*text/css' /tmp/hosted-qa/styles.css.headers
          for f in data.js search-index-v1.2.js search-engine-v1.2.js app.js; do
            grep -Eqi '^content-type:.*(javascript|ecmascript|text/plain)' "/tmp/hosted-qa/$f.headers"
          done

          for f in index.html styles.css data.js search-index-v1.2.js search-engine-v1.2.js app.js methodik.html datenschutz.html; do
            cmp "$f" "/tmp/hosted-qa/$f"
          done
          echo "92d4de7de0954cebd5b9a2d6d37b4a8f495c5f91d117ff192a748f5e0f63f7c7  /tmp/hosted-qa/data.js" | sha256sum --check -
          cmp /tmp/hosted-qa/index.html /tmp/hosted-qa/root.html

          {
            echo "## Hosted HTTP QA"
            echo
            echo "- Root path and index.html are byte-identical."
            echo "- All eight hosted files are byte-identical to the current GitHub test commit; data.js also matches the frozen production SHA-256."
            echo "- HTML/CSS/JS MIME families are valid."
            echo
            echo "### Cache headers"
            for f in index.html styles.css data.js search-index-v1.2.js search-engine-v1.2.js app.js; do
              printf -- "- %s: " "$f"
              grep -i '^cache-control:' "/tmp/hosted-qa/$f.headers" | tr -d '\r' || echo "no Cache-Control header"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare system Chrome QA
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Real-origin Chromium QA
        shell: bash
        run: |
          cat > hosted-qa.mjs <<'NODE'
          import { chromium } from "playwright-core";
          const base = process.env.BASE_URL;
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME_PATH, args:["--no-sandbox"]});
          const page = await browser.newPage({viewport:{width:1280,height:900}});
          const pageErrors = [];
          const consoleErrors = [];
          const externalRequests = [];
          const badResponses = [];
          page.on("pageerror", e => pageErrors.push(String(e)));
          page.on("console", m => { if (m.type()==="error") consoleErrors.push(m.text()); });
          page.on("response", r => {
            if (r.status() >= 400) badResponses.push({status:r.status(),url:r.url()});
          });
          page.on("request", r => {
            try {
              const u = new URL(r.url());
              const b = new URL(base);
              if (["http:","https:"].includes(u.protocol) && u.origin !== b.origin) externalRequests.push(r.url());
            } catch {}
          });

          await page.goto(base + "/?qa=" + process.env.GITHUB_SHA, {waitUntil:"networkidle"});
          await page.waitForFunction(() => document.querySelector("#resultCount")?.textContent?.includes("1321"));
          assert((await page.locator("[data-offer-id]").count()) === 1321, "initial card count != 1321");
          assert((await page.locator("#resultCount").textContent()).includes("1321 von 1321 aktuellen Angeboten"), "initial result text mismatch");
          assert(pageErrors.length===0, "page errors on initial load: "+pageErrors.join(" | "));
          const badInitial = badResponses.filter(x => !/\/favicon\.ico(?:\?|$)/.test(x.url));
          const nonResourceConsoleInitial = consoleErrors.filter(x => !x.includes("Failed to load resource"));
          assert(nonResourceConsoleInitial.length===0, "console errors on initial load: "+nonResourceConsoleInitial.join(" | "));
          assert(badInitial.length===0, "unexpected HTTP errors on initial load: "+JSON.stringify(badInitial));
          assert(externalRequests.length===0, "unexpected external runtime requests: "+externalRequests.join(" | "));

          await page.locator("#smartInput").fill("Ich habe CHF 800 und möchte Datenjournalismus lernen.");
          await page.locator("#smartSearchForm").evaluate(form => form.requestSubmit());
          await page.waitForFunction(() => document.querySelector("#resultCount")?.textContent?.includes("Treffer"));
          const q1 = await page.locator("#resultCount").textContent();
          assert(q1.includes("2 Treffer"), "Q1 expected 2 Treffer: "+q1);
          assert(q1.includes("14 nicht eindeutig"), "Q1 expected 14 uncertain: "+q1);
          assert((await page.locator(".search-result-list [data-offer-id]").count())===16, "Q1 shown results != 16");
          assert(!decodeURIComponent(page.url()).includes("Ich habe CHF 800"), "raw Smart query leaked to URL");

          await page.locator("#smartInput").fill("Recherche kostenlos");
          await page.locator("#smartSearchForm").evaluate(form => form.requestSubmit());
          await page.waitForFunction(() => document.querySelector("#priceFilter")?.value === "KOSTENLOS");
          await page.locator("#smartInput").fill("Datenjournalismus");
          await page.locator("#smartSearchForm").evaluate(form => form.requestSubmit());
          await page.waitForFunction(() => document.querySelector("#priceFilter")?.value === "");
          assert(await page.locator("#priceFilter").inputValue()==="", "Smart-owned price filter persisted");

          await page.locator("#smartInput").fill("Ich möchte einen Kurs");
          await page.locator("#smartSearchForm").evaluate(form => form.requestSubmit());
          await page.waitForFunction(() => document.querySelector("#smartSummary")?.textContent?.includes("Keine belastbaren Kriterien erkannt"));
          assert((await page.locator("#resultCount").textContent()).includes("1321 von 1321"), "NOTHING_RECOGNIZED did not safely restore classic list");

          assert(await page.locator("#resetFilters").isDisabled(), "reset should be disabled when NOTHING_RECOGNIZED leaves no active state");
          await page.locator("#searchInput").fill("MAZ");
          await page.waitForFunction(() => !document.querySelector("#resetFilters")?.disabled);
          await page.locator("#resetFilters").click();
          assert((await page.evaluate(() => document.activeElement?.id))==="searchInput", "reset focus not on classic search");
          assert((await page.locator("#smartInput").inputValue())==="", "reset did not clear Smart input");

          await page.locator("#smartInput").fill("Moderation");
          await page.locator("#smartInput").press("Enter");
          await page.waitForFunction(() => document.querySelectorAll(".search-explanation").length > 0);
          assert((await page.locator(".search-explanation").count())>0, "criterion explanations missing");
          await page.locator("#smartChangeButton").click();
          assert((await page.evaluate(() => document.activeElement?.id))==="smartInput", "Ändern did not focus Smart input");

          await page.locator("#resetFilters").click();
          await page.locator("#searchInput").fill("OSINT");
          await page.waitForFunction(() => document.querySelector("#resultCount")?.textContent && !document.querySelector("#resultCount").textContent.startsWith("0 von"));
          const osintActual = await page.locator("[data-offer-id]").count();
          const osintExpected = await page.evaluate(() => {
            const today = new Date();
            today.setHours(0,0,0,0);
            const active = (window.WEITERBILDUNGSRADAR_OFFERS || []).filter(o => {
              if (!o.endDate) return true;
              const d = /^\d{4}-\d{2}-\d{2}$/.test(String(o.endDate)) ? new Date(o.endDate + "T23:59:59") : null;
              return !d || d >= today;
            });
            const activeIds = new Set(active.map(o => o.id));
            const semanticIds = new Set((window.SFJ_SEARCH_INDEX?.rows || []).filter(r =>
              activeIds.has(r.id) && Array.isArray(r.tc) && r.tc.includes("RESEARCH_INVESTIGATION")
            ).map(r => r.id));
            const literalIds = new Set(active.filter(o => {
              const text = [
                o.provider, o.title, o.description, o.access, o.priceDisplay, o.format,
                o.duration, o.start, o.language, o.country, o.region
              ].join(" ").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
              return text.includes("osint");
            }).map(o => o.id));
            return new Set([...semanticIds, ...literalIds]).size;
          });
          assert(osintExpected > 0, "OSINT has no active literal or RESEARCH_INVESTIGATION rows");
          assert(osintActual === osintExpected, "OSINT classic search union mismatch: actual="+osintActual+" expected="+osintExpected);

          await page.locator("#resetFilters").click();
          await page.locator("#searchInput").fill("MAZ");
          await page.waitForFunction(() => location.search.includes("q=MAZ"));
          assert(new URL(page.url()).searchParams.get("q")==="MAZ", "History API URL state failed on hosted origin");

          assert((await page.locator(".smart-result-card").count())===0, "legacy top-3 DOM present");
          assert((await page.locator(".smart-bundle").count())===0, "legacy bundle DOM present");

          await page.setViewportSize({width:390,height:844});
          await page.locator("#smartInput").fill("Moderation");
          await page.locator("#smartInput").press("Enter");
          await page.locator("#smartChangeButton").waitFor({state:"visible"});
          const dims = await page.evaluate(() => ({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
          assert(dims.sw<=dims.cw, "mobile horizontal overflow: "+JSON.stringify(dims));

          await page.goto(base + "/methodik.html", {waitUntil:"networkidle"});
          assert((await page.locator("h1").textContent()).trim()==="Methodik", "methodik path failed");
          await page.goto(base + "/datenschutz.html", {waitUntil:"networkidle"});
          assert((await page.locator("h1").textContent()).trim()==="Datenschutz", "datenschutz path failed");

          assert(pageErrors.length===0, "page errors: "+pageErrors.join(" | "));
          const badFinal = badResponses.filter(x => !/\/favicon\.ico(?:\?|$)/.test(x.url));
          const nonResourceConsoleFinal = consoleErrors.filter(x => !x.includes("Failed to load resource"));
          assert(nonResourceConsoleFinal.length===0, "console errors: "+nonResourceConsoleFinal.join(" | "));
          assert(badFinal.length===0, "unexpected HTTP errors: "+JSON.stringify(badFinal));
          const favicon404 = badResponses.filter(x => /\/favicon\.ico(?:\?|$)/.test(x.url));
          if (favicon404.length) console.log("IGNORED_BENIGN_FAVICON_404", JSON.stringify(favicon404));
          await browser.close();
          console.log("HOSTED_CHROMIUM_QA_PASS");
          NODE
          node hosted-qa.mjs
          {
            echo
            echo "## Hosted Chromium QA"
            echo
            echo "- 1321/1321 initial runtime visibility PASS"
            echo "- Smart Q1: 2 MATCH + 14 UNCERTAIN PASS"
            echo "- shared Smart/classic state and Smart-owned filter cleanup PASS"
            echo "- NOTHING_RECOGNIZED safe fallback PASS"
            echo "- reset/focus/keyboard/reason rendering PASS"
            echo "- raw Smart text absent from URL PASS"
            echo "- classic OSINT search = literal matches ∪ RESEARCH_INVESTIGATION alias matches PASS"
            echo "- real-origin History API state PASS"
            echo "- mobile 390px no horizontal overflow PASS"
            echo "- methodik/datenschutz relative paths PASS"
            echo "- no legacy top-3/bundle DOM PASS"
            echo "- no unexpected external runtime requests PASS"
          } >> "$GITHUB_STEP_SUMMARY"

