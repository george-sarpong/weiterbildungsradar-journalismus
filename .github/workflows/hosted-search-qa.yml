name: Hosted Site Release Smoke QA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hosted-search-qa.yml
      - index.html
      - app.js
      - data.js
      - smart-search-data.js
      - styles.css
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hosted-search-qa.yml
      - index.html
      - app.js
      - data.js
      - smart-search-data.js
      - styles.css
  workflow_dispatch:
permissions:
  contents: read

jobs:
  local-pr-qa:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Zurich
    steps:
      - uses: actions/checkout@v4
      - name: Test isolated production price and variant resolvers
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const src=fs.readFileSync('app.js','utf8');
          const extract=(start,end)=>{
            const a=src.indexOf(start), b=src.indexOf(end,a+start.length);
            if(a<0||b<a)throw new Error('Resolver extraction boundary changed: '+start);
            return src.slice(a,b);
          };
          const core=extract('  const amountWithRequiredComponents =','  const freeStatusRank =');
          const alternative=extract('  const smartAlternative =','  const smartWhy =');
          const api=vm.runInNewContext(`(()=>{
            const isDateActive=()=>true;
            const topicMatch=()=>({match:true,score:10});
            const getSmartRecord=offer=>offer.record;
            const unverifiedFormatMayMatch=()=>true;
            const resolveFreeOption=()=>null;
            ${core}
            ${alternative}
            return {resolveBudget,smartAlternative};
          })()`);
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const makeOption=(overrides={})=>({
            amountType:'EXACT',amount:100,currency:'CHF',
            eligibilityType:'NONE',billingBasis:'TOTAL',priceScope:'FULL_OFFER',
            taxMode:'UNSPECIFIED',components:[],...overrides
          });
          const record=priceOptions=>({parserStatus:'AUTO_ACCEPT',priceEligible:true,
            delivery:{evidenceTier:'UNKNOWN'},priceOptions});
          const parsed=(amount,deliveryIntents=[])=>({budget:{amount,currency:'CHF'},
            deliveryIntents,excludeEnglish:false,tokens:['test'],freeOnly:false});
          const budget=(option,amount)=>api.resolveBudget({},record([option]),parsed(amount),
            {matchedVariantIds:[]});
          const free=makeOption({amountType:'FREE',amount:0,currency:'CHF'});
          assert(budget(free,0).status==='DIRECT_FIT','Truly free price regressed');
          const charged=makeOption({amountType:'FREE',amount:0,currency:'CHF',
            components:[{requirementStatus:'REQUIRED',amountType:'EXACT',amount:120}]});
          assert(budget(charged,50).status==='OVER_BUDGET',
            'FREE plus required CHF 120 incorrectly satisfies CHF 50');
          assert(budget(charged,150).amount===120,
            'Required fee not included in effective total');
          const unknown=makeOption({amountType:'FREE',amount:0,currency:'CHF',
            components:[{requirementStatus:'REQUIRED',amountType:'ON_REQUEST'}]});
          assert(budget(unknown,50).status!=='DIRECT_FIT',
            'FREE plus unknown mandatory cost classified as certain');
          assert(budget(makeOption({currency:'EUR',amount:300}),500).status==='DIRECT_FIT',
            'CHF/EUR 1:1 product planning regressed');
          assert(budget(makeOption({currency:'GBP',amount:300}),500).status==='PRICE_UNKNOWN',
            'Unsupported GBP/CHF 1:1 planning incorrectly enabled');
          const publicAndMember=record([
            makeOption({amount:500}),
            makeOption({amount:150,eligibilityType:'PROFESSION',eligibilityValue:'JOURNALIST'})
          ]);
          assert(api.resolveBudget({},publicAndMember,parsed(800),{matchedVariantIds:[]}).status
            ==='DIRECT_FIT','Public full price should win over optional journalist discount');
          assert(api.resolveBudget({},publicAndMember,parsed(300),{matchedVariantIds:[]}).status
            ==='TARGET_GROUP_FIT','Journalist-only price should remain conditional');
          const onlyFree=record([
            makeOption({amount:60}),
            makeOption({amountType:'FREE',amount:0,currency:null,
              eligibilityType:'MEMBERSHIP',eligibilityValue:'MEMBER'})
          ]);
          const onlyFreeParsed=parsed(100); onlyFreeParsed.freeOnly=true;
          assert(api.resolveBudget({},onlyFree,onlyFreeParsed,{matchedVariantIds:[]}).status
            !=='DIRECT_FIT','Paid public tariff cannot satisfy only-free search');
          const altParsed=parsed(500,['ONLINE']);
          const offerWithVariants={format:'ONLINE LIVE',record:record([
            makeOption({amount:100,deliveryVariantRefs:['A']})])};
          assert(api.smartAlternative(offerWithVariants,altParsed)===null,
            'Variant-specific price incorrectly reused for unverified format');
          const offerNeutral={format:'ONLINE LIVE',record:record([makeOption({amount:100})])};
          assert(api.smartAlternative(offerNeutral,altParsed)!==null,
            'Variant-neutral budget price unexpectedly excluded from alternatives');
          console.log('PRODUCTION_RESOLVER_FIXTURE_PASS');
          NODE
      - name: Run integrated Chromium regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/media-skills-local-qa.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node --input-type=module <<'NODE'
          import {chromium} from 'playwright-core';
          const assert=(value,message)=>{if(!value)throw new Error(message)};
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
          try {
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[];
            page.on('pageerror',error=>pageErrors.push(String(error)));
            await page.clock.install({time:new Date('2026-10-25T12:00:00+01:00')});
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
            const integrity=await page.evaluate(()=>{
              const offers=window.WEITERBILDUNGSRADAR_OFFERS||[];
              const smart=window.MEDIA_SKILLS_SMART_DATA?.byId||{};
              const ids=offers.map(offer=>offer.id);
              const idSet=new Set(ids);
              return {total:offers.length,unique:idSet.size,smart:Object.keys(smart).length,
                missingSmart:ids.filter(id=>!Object.hasOwn(smart,id)),
                smartOrphans:Object.keys(smart).filter(id=>!idSet.has(id))};
            });
            const total=integrity.total;
            assert(total===1352&&integrity.unique===1352&&integrity.smart===1352
              &&integrity.missingSmart.length===0&&integrity.smartOrphans.length===0,
              'Roster/Smart sidecar ID integrity failed: '+JSON.stringify(integrity));
            assert(await page.locator('[data-offer-id="V78-03"]').count()===1,'ITTA future session missing');
            const bevisible=await page.locator('[data-offer-id="V77-04"]').innerText();
            assert(bevisible.includes('20.11.2026'),'BeVisible next session is incorrect');
            const query=async(input,expectedDirect,expectedOther)=>{
              await page.locator('#smartInput').fill(input);
              await page.locator('#smartSearchForm').evaluate(form=>form.requestSubmit());
              const direct=await page.locator('#smartResults > article.smart-result-card').count();
              const other=await page.locator('#smartResults section article.smart-result-card').count();
              const summary=await page.locator('#smartSummary').innerText();
              const titles=await page.locator('#smartResults article.smart-result-card h3').allInnerTexts();
              assert(direct===expectedDirect&&other===expectedOther,
                'Wrong groups for '+input+' direct='+direct+' other='+other
                +' expected='+expectedDirect+'/'+expectedOther+' titles='+JSON.stringify(titles)
                +' summary='+JSON.stringify(summary));
              return {direct,other,summary,titles};
            };
            const ki=await query('Ich suche einen Online-Kurs zu KI für höchstens CHF 500',0,3);
            assert(/Kein Kurs gefunden.*Budget/i.test(ki.summary),'Unsafe KI budget summary: '+ki.summary);
            assert((await page.locator('#smartResults section').innerText()).includes('Kursanbieter'),'No clear alternative warning');
            const data800=await query('Ich habe CHF 800 und möchte Datenjournalismus lernen',2,1);
            assert(/weitere Kurse könnten passen/i.test(data800.summary),'Conditional data-journalism tariff not disclosed');
            const ki300=await query('KI online höchstens CHF 300',0,3);
            assert(/Kein Kurs gefunden.*Budget/i.test(ki300.summary),'Unsafe KI CHF 300 summary');
            await query('Ich habe nicht mehr als 300 Franken, aber kein Englisch, Podcast',2,1);
            await page.locator('#searchInput').fill('MAZ');
            assert((await page.locator('#cards [data-offer-id]').count())>0,'Classic search failed');
            assert(!decodeURIComponent(page.url()).includes('Ich habe nicht mehr als 300'),
              'Private Smart text leaked into URL');
            assert(!Object.values(await page.evaluate(()=>Object.fromEntries(
              Object.keys(localStorage).map(k=>[k,localStorage.getItem(k)]))))
              .some(value=>String(value).includes('kein Englisch')),
              'Private Smart text leaked into localStorage');
            await page.locator('#resetFilters').click();
            const baseVisible=await page.locator('#cards [data-offer-id]').count();
            assert(baseVisible>0,'No visible catalogue cards');
            assert(await page.locator('#cards [data-offer-id="PCC-P33"]').count()===0,
              'Archived QA09 item became visible');
            const filterIds=['focusFilter','typeFilter','priceFilter','formatFilter',
              'languageFilter','countryFilter','levelFilter'];
            let changedFilters=0;
            for(const id of filterIds){
              const ctl=page.locator('#'+id);
              const options=await ctl.locator('option').evaluateAll(nodes=>
                nodes.map(n=>n.value).filter(Boolean));
              assert(options.length>0,'No populated options for '+id);
              await ctl.selectOption(options[0]);
              const afterFilter=await page.locator('#cards [data-offer-id]').count();
              assert(afterFilter<=baseVisible,'Filter expanded results: '+id);
              if(afterFilter!==baseVisible)changedFilters++;
              await ctl.selectOption('');
              assert(await page.locator('#cards [data-offer-id]').count()===baseVisible,
                'Filter did not reset: '+id);
            }
            assert(changedFilters===7,'Not all seven filters alter results: '+changedFilters);
            const firstId=await page.locator('#cards [data-offer-id]').first()
              .getAttribute('data-offer-id');
            await page.locator('#cards [data-favorite-id="'+firstId+'"]').first().click();
            await page.locator('#favoritesToggle').click();
            assert(await page.locator('#cards [data-offer-id]').count()===1,
              'Favorites-only view did not isolate one offer');
            assert(await page.locator('#cards [data-offer-id]').first().getAttribute('data-offer-id')===firstId,
              'Favorites-only view selected wrong offer');
            await page.locator('#resetFilters').click();
            const sortOptions=await page.locator('#sortSelect option').evaluateAll(nodes=>
              nodes.map(n=>n.value).filter(v=>v&&v!=='EDITORIAL'));
            assert(sortOptions.length>0,'No secondary sort mode available');
            await page.locator('#sortSelect').selectOption(sortOptions[0]);
            assert(await page.locator('#cards [data-offer-id]').count()===baseVisible,
              'Sorting unexpectedly changed the result set');
            await page.locator('#resetFilters').click();
            await page.setViewportSize({width:390,height:844});
            const sizes=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
            assert(sizes.scroll<=sizes.client,'Mobile page horizontal overflow: '+JSON.stringify(sizes));
            assert(pageErrors.length===0,'Browser errors: '+pageErrors.join(' | '));
            console.log('LOCAL_PR_CHROMIUM_REGRESSION_PASS',JSON.stringify({total,ki,mobile:sizes}));
            // Zukunftstest: ohne buchbare Präsenzausgabe darf nur die separat
            // VERIFIED markierte Selbstlernvariante von CAD-002 angezeigt werden.
            await page.clock.setFixedTime(new Date('2027-02-03T12:00:00+01:00'));
            await page.reload({waitUntil:'networkidle'});
            const cad=page.locator('#cards [data-offer-id="CAD-002"]');
            assert(await cad.count()===1,'Verified self-study variant vanished after last session');
            const cadText=await cad.innerText();
            const cadNormalized=cadText.toLocaleLowerCase('de-CH');
            assert(cadNormalized.includes('online selbstlernen')&&cadNormalized.includes('chf 250')
              &&cadNormalized.includes('verfügbarkeit beim anbieter anfragen')
              &&cadNormalized.includes('anbieter kontaktieren')
              &&!cadNormalized.includes('öffentlich buchbar')
              &&!cadNormalized.includes('lausanne')&&!cadNormalized.includes('23.11.2026')
              &&!cadNormalized.includes('chf 500'),
              'Self-study card retained stale in-person claims: '+cadText);
            for(const id of ['CAD-001','CAD-003','CAD-005']){
              assert(await page.locator('#cards [data-offer-id="'+id+'"]').count()===0,
                'Unverified self-study variant improperly reinstated: '+id);
            }
            await page.locator('#formatFilter').selectOption('PRÄSENZ');
            assert(await cad.count()===0,'Expired in-person option passed presence filter');
            await page.locator('#formatFilter').selectOption('ONLINE SELBSTLERNEN');
            assert(await cad.count()===1,'Verified self-study option missing from online filter');
            await page.locator('#formatFilter').selectOption('');
            await page.locator('#smartInput').fill('Photoshop Base online selbstlernen höchstens CHF 300');
            await page.locator('#smartSearchForm').evaluate(form=>form.requestSubmit());
            const onlineResults=await page.locator('#smartResults').innerText();
            assert(onlineResults.includes('Photoshop - Base')
              &&onlineResults.includes('Cadschool')
              &&onlineResults.includes('CHF 250'),
              'Self-study price/format missing from Smart Search: '+onlineResults);
            await page.locator('#smartInput').fill('Photoshop Base Präsenz höchstens CHF 500');
            await page.locator('#smartSearchForm').evaluate(form=>form.requestSubmit());
            const inPersonResults=await page.locator('#smartResults').innerText();
            assert(!inPersonResults.includes('Photoshop - Base')
              || !inPersonResults.includes('Cadschool'),
              'Expired CAD-002 in-person course leaked into Smart Search: '+inPersonResults);
            assert(pageErrors.length===0,'Future date browser errors: '+pageErrors.join(' | '));
            console.log('VARIANT_AWARE_VISIBILITY_CHROMIUM_PASS');
          } finally {await browser.close()}
          NODE
  hosted-qa:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://george-sarpong.github.io/weiterbildungsradar-journalismus
    steps:
      - uses: actions/checkout@v4
      - name: Public HTTPS assets exactly match main branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hosted-qa
          files=(index.html data.js smart-search-data.js app.js styles.css)
          matched=0
          for attempt in $(seq 1 18); do
            ok=1
            for f in "${files[@]}"; do
              if ! curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 45 -H 'Cache-Control: no-cache' "$BASE_URL/$f?qa=$GITHUB_SHA" -o "/tmp/hosted-qa/$f"; then ok=0; break; fi
              if ! cmp -s "$f" "/tmp/hosted-qa/$f"; then ok=0; break; fi
            done
            if [[ "$ok" == 1 ]]; then matched=1; break; fi
            echo "Hosted content not yet byte-identical to main (attempt $attempt)"
            sleep 10
          done
          test "$matched" == 1
          echo "HOSTED_ASSETS_BYTE_IDENTICAL_PASS"
          sha256sum "${files[@]}"
          curl --fail --silent --show-error --location --retry 3 "$BASE_URL/?qa=$GITHUB_SHA" -o /tmp/hosted-qa/root.html
          cmp index.html /tmp/hosted-qa/root.html
          echo "HOSTED_ROOT_INDEX_PASS"
      - name: Real-origin Chromium smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node --input-type=module <<'NODE'
          import {chromium} from 'playwright-core';
          const base=process.env.BASE_URL;
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
          try {
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(base+'/?qa='+process.env.GITHUB_SHA,{waitUntil:'networkidle'});
            await page.waitForFunction(()=>/\d/.test(document.querySelector('#resultCount')?.textContent||''));
            const visible=await page.locator('[data-offer-id]').count();
            assert(visible>0,'No course cards rendered');
            const data=await page.evaluate(()=>{
              const offers=window.WEITERBILDUNGSRADAR_OFFERS||[];
              const side=window.MEDIA_SKILLS_SMART_DATA;
              return {total:offers.length,unique:new Set(offers.map(o=>o.id)).size,eligible:side?.byId?.['OFFER-NOBLE-067']?.priceEligible,parser:side?.byId?.['OFFER-NOBLE-067']?.parserStatus};
            });
            assert(data.total>=116&&data.total===data.unique,'Invalid/duplicate course dataset: '+JSON.stringify(data));
            assert(data.eligible===false&&data.parser==='NEEDS_REVIEW','Variable-price budget guard missing');
            for(const id of ['focusFilter','typeFilter','priceFilter','formatFilter','languageFilter','countryFilter','levelFilter']){
              assert(await page.locator('#'+id).count()===1,'Missing filter '+id);
            }
            await page.locator('#searchInput').fill('MAZ');
            await page.waitForFunction(()=>new URLSearchParams(location.search).get('q')==='MAZ');
            assert(await page.locator('[data-offer-id]').count()>0,'MAZ search returned no cards');
            await page.locator('#resetFilters').click();
            await page.waitForFunction(()=>!new URLSearchParams(location.search).get('q'));
            assert(await page.locator('#searchInput').inputValue()==='','Reset did not clear search');
            await page.locator('#smartInput').fill('Ich habe CHF 800 und möchte Datenjournalismus lernen');
            await page.locator('#smartSearchForm').evaluate(el=>el.requestSubmit());
            await page.waitForFunction(()=>/Kurse passen zum angegebenen Budget|Kein Kurs gefunden, der sicher ins angegebene Budget passt/i.test(document.querySelector('#smartSummary')?.textContent||''));
            assert(!decodeURIComponent(page.url()).includes('Ich habe CHF 800'),'Smart input leaked into URL');
            await page.setViewportSize({width:390,height:844});
            const dims=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
            assert(dims.scroll<=dims.client,'Mobile horizontal overflow: '+JSON.stringify(dims));
            assert(errors.length===0,'Browser JS errors: '+errors.join(' | '));
            console.log('HOSTED_REAL_ORIGIN_CHROMIUM_PASS',JSON.stringify({visible,data,filters:7}));
          } finally {await browser.close()}
          NODE
